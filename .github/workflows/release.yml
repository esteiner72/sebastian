name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Manifest validation is independent of OS and Node version, so one job on one runner is enough.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "release tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run eval
      - run: npm run check:manifest
      # The claude binary is pinned exactly so a validator this repo does not control cannot turn a
      # release red on its own. A directory holding marketplace.json validates as a marketplace, so
      # the plugin manifest is named directly for a second pass.
      - run: npm install -g @anthropic-ai/claude-code@2.1.257
      - run: claude plugin validate . --strict
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
      - run: claude plugin validate .claude-plugin/plugin.json --strict
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude

  # Publishes through npm trusted publishing: the OIDC token is the only credential, and the
  # trusted publisher on npmjs.com is bound to this repository and this workflow filename.
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later, which the Node 24 image does not guarantee.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Publish
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --provenance --tag "$DIST_TAG"
